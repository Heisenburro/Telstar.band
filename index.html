<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Telstar</title>
  <style>
    :root {
      --bg: #0c0c0e;
      --card-bg: #16161a;
      --fg: #f3f3f5;
      --muted: #888892;
      --border: #242429;
      --accent: #d44329;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2.5rem 1.25rem;
    }

    .container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      text-align: center;
    }

    h1 {
      font-size: 2.2rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .subheading {
      font-size: 0.95rem;
      color: var(--muted);
      letter-spacing: 0.04em;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .btn {
      display: block;
      padding: 0.9rem 1.25rem;
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--fg);
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 500;
      letter-spacing: 0.03em;
      border-radius: 4px;
      transition: border-color 0.15s ease, background-color 0.15s ease;
    }

    .btn:hover {
      border-color: var(--accent);
      background-color: #1c1c22;
    }

    footer {
      margin-top: 1.5rem;
      font-size: 0.75rem;
      color: var(--muted);
    }
  </style>
</head>
<body>

  <main class="container">
    <header>
      <h1>Telstar</h1>
      <p class="subheading">Official Links &amp; Releases</p>
    </header>

    <nav class="links">
      <a href="https://bandcamp.com" class="btn" target="_blank" rel="noopener">Bandcamp</a>
      <a href="https://spotify.com" class="btn" target="_blank" rel="noopener">Spotify</a>
      <a href="https://instagram.com" class="btn" target="_blank" rel="noopener">Instagram</a>
      <a href="mailto:contact@telstar.band" class="btn">Contact</a>
    </nav>

    <footer>
      &copy; 2026 Telstar
    </footer>
  </main>

</body>
</html>
